name: Collaboration on Kubernetes (kind)

# Manual: deploys deploy/k8s on a kind cluster and runs the resilience acceptance against it.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Acceptance scenarios"
        default: "load,kill-relay,redis-restart"

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Install relay dependencies
        working-directory: server
        run: npm ci

      - name: Deploy and run the acceptance
        run: deploy/k8s/kind/run.sh
        env:
          SCENARIOS: ${{ inputs.scenarios }}
