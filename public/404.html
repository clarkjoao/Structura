<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structura</title>
    <meta
      name="description"
      content="Structura, uma plataforma para modelar diagramas de arquitetura."
    />
    <meta name="author" content="clark.joao@gmail.com" />
    <script>
      // GitHub Pages SPA fallback: redirect to index.html for client-side routing
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        window.location.replace(
          "/index.html" + (search ? search : "") + (hash ? hash : "")
        );
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>
        <a href="/">Redirect to Structura</a>
      </p>
    </noscript>
  </body>
</html>
