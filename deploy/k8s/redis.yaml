# Shared room state for the relays. One instance is enough for the target load (see README).
# Rooms survive a relay restart; they survive a Redis restart only with persistence turned on
# (see README) — without it, hosts reseed their rooms automatically.
apiVersion: v1
kind: Service
metadata:
  name: collab-redis
  namespace: structura-collab
spec:
  selector:
    app: collab-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collab-redis
  namespace: structura-collab
spec:
  serviceName: collab-redis
  replicas: 1
  selector:
    matchLabels:
      app: collab-redis
  template:
    metadata:
      labels:
        app: collab-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Persistence off by default; for AOF, set "--appendonly", "yes" and mount a volume at /data.
          args:
            ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi }
