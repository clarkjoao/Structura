# WebSockets through ingress-nginx. No affinity on purpose: the relay does not need it.
# Long timeouts keep idle sessions open (clients also ping every 15 s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collab-relay
  namespace: structura-collab
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: collab-relay, port: { name: http } }
          - path: /health
            pathType: Exact
            backend:
              service: { name: collab-relay, port: { name: http } }
