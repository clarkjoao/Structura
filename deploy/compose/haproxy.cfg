# Round-robin, no affinity: consecutive connections — including a client's reconnect — land on
# different relays. Long tunnel timeout for WebSockets; a dead relay is taken out by its health
# check and its sockets reconnect elsewhere.
global
  maxconn 20000

defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h
  option http-server-close

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 2s

frontend collab
  bind :3000
  default_backend relays

backend relays
  balance roundrobin
  option httpchk GET /health
  default-server check inter 1s fall 2 rise 1 resolvers docker init-addr none
  server relay-1 relay-1:3000
  server relay-2 relay-2:3000
  server relay-3 relay-3:3000
