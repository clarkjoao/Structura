<!doctype html>
<html>
  <body style="margin: 0">
    <iframe id="f" src="dist/embed.html" style="border: 0; width: 1400px; height: 900px"></iframe>
    <script>
      const f = document.getElementById("f");
      window.ready = new Promise((r) =>
        window.addEventListener("message", (e) => {
          if (e.data?.type === "STRUCTURA_READY") r();
        }),
      );
      window.send = async (url) => {
        const g = await (await fetch(url)).json();
        f.contentWindow.postMessage({ type: "STRUCTURA_LOAD_GRAPH", ...g }, "*");
      };
    </script>
  </body>
</html>
